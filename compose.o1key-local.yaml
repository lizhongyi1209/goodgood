services:
  web:
    environment: &goodgood-o1key-environment
      GENERATION_API_BASE_URL: https://cf-api.o1key.com
      GENERATION_API_KEY: ""
      GENERATION_API_KEY_FILE: /run/secrets/goodgood_o1key_api_key
      GENERATION_PROVIDER_ALLOW_INSECURE_LOOPBACK: "false"
      GENERATION_PROVIDER_KIND: o1key
      GENERATION_POLL_INTERVAL_MS: "1000"
      GENERATION_POLL_TIMEOUT_MS: "180000"
      GENERATION_REQUEST_TIMEOUT_MS: "30000"
      GOODGOOD_LOCAL_DEVELOPMENT_RUNTIME: "true"
      GOODGOOD_LOCAL_SEEDANCE_PREVIEW: "true"
      GOODGOOD_LOCAL_SEEDANCE_API_KEY_FILE: /run/secrets/goodgood_o1key_api_key
    secrets:
      - goodgood_o1key_api_key

  worker:
    environment:
      <<: *goodgood-o1key-environment
    secrets:
      - goodgood_o1key_api_key

secrets:
  goodgood_o1key_api_key:
    file: ${GOODGOOD_O1KEY_API_KEY_FILE:?Use npm run stack:up with an external development key file}
