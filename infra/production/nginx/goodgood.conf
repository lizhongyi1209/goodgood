include /etc/nginx/goodgood/production-active-upstream.conf;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name goodgood.o1key.com;

    include /etc/nginx/snippets/goodgood-cloudflare-origin-only.conf;

    if ($host != goodgood.o1key.com) {
        return 444;
    }

    return 301 https://goodgood.o1key.com$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name goodgood.o1key.com;

    include /etc/nginx/snippets/goodgood-cloudflare-origin-only.conf;

    if ($host != goodgood.o1key.com) {
        return 444;
    }
    ssl_certificate /etc/goodgood/production/tls/goodgood-origin.pem;
    ssl_certificate_key /etc/goodgood/production/tls/goodgood-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:goodgood_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    error_page 503 =503 /__goodgood_maintenance.html;
    location = /__goodgood_maintenance.html {
        internal;
        alias /var/www/goodgood-production/maintenance/index.html;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Retry-After 300 always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    location / {
        if (-f /etc/goodgood/production/maintenance.enabled) {
            return 503;
        }

        proxy_pass http://goodgood_active;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 70s;
    }
}
