<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>GoodGood 正在维护</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f8f8fa;
        --ink: #292933;
        --muted: #737381;
        --accent: #b52b30;
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 24px;
      }
      section {
        width: min(100%, 520px);
        text-align: center;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 44px;
      }
      .mark { width: 31px; height: 24px; }
      .wordmark { width: 98px; height: 22px; }
      h1 {
        margin: 0;
        font-size: clamp(24px, 5vw, 32px);
        font-weight: 650;
        letter-spacing: -0.025em;
      }
      p {
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="maintenance-title">
        <div class="brand" role="img" aria-label="GoodGood">
          <svg class="mark" viewBox="0 0 44 32" aria-hidden="true">
            <g fill="none" stroke="var(--accent)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18.8 7.55C16.95 5.9 14.55 5 12 5C5.95 5 2 9.7 2 16C2 22.3 5.95 27 12 27C15.15 27 17.8 25.9 19.65 23.85V17H12.45" />

            </g>
          </svg>
          <svg class="wordmark" viewBox="0 0 143 32" aria-hidden="true">
            <g fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23.5 7.9C21.2 5.75 18.1 4.6 14.6 4.6C7.75 4.6 3 9.45 3 16C3 22.55 7.75 27.4 14.6 27.4C18.25 27.4 21.35 26.05 23.45 23.5V16.9H15.2" />
              <ellipse cx="32" cy="19.7" rx="6.3" ry="7.2" />
              <ellipse cx="43.8" cy="19.7" rx="6.3" ry="7.2" />
              <path d="M66.2 4.8V19.7C66.2 24 63.5 26.9 59.7 26.9C55.8 26.9 53.1 24 53.1 19.7C53.1 15.4 55.8 12.5 59.7 12.5C63.5 12.5 66.2 15.4 66.2 19.7" />
              <path d="M96.5 7.9C94.2 5.75 91.1 4.6 87.6 4.6C80.75 4.6 76 9.45 76 16C76 22.55 80.75 27.4 87.6 27.4C91.25 27.4 94.35 26.05 96.45 23.5V16.9H88.2" />
              <ellipse cx="105" cy="19.7" rx="6.3" ry="7.2" />
              <ellipse cx="116.8" cy="19.7" rx="6.3" ry="7.2" />
              <path d="M139.2 4.8V19.7C139.2 24 136.5 26.9 132.7 26.9C128.8 26.9 126.1 24 126.1 19.7C126.1 15.4 128.8 12.5 132.7 12.5C136.5 12.5 139.2 15.4 139.2 19.7" />
            </g>
          </svg>
        </div>
        <h1 id="maintenance-title">我们正在准备正式环境</h1>
        <p>GoodGood 暂时无法使用。安全切换完成后，请稍后再来。</p>
      </section>
    </main>
  </body>
</html>
