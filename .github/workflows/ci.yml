name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.12.0

jobs:
  verify:
    name: Verify source and image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run repository quality gate
        run: npm run check:local

      - name: Verify pull-request image build
        if: github.event_name == 'pull_request'
        run: >-
          docker build
          --build-arg GOODGOOD_REVISION=${{ github.sha }}
          --tag goodgood:ci-${{ github.sha }}
          .

  publish-image:
    name: Publish immutable image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Derive release metadata
        id: release
        env:
          GOODGOOD_RELEASE_REPOSITORY: ${{ github.repository }}
        run: node scripts/release-metadata.mjs --github-output

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.release.outputs.image-name }}:${{ github.sha }}
          build-args: |
            GOODGOOD_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.goodgood.migration.version=${{ steps.release.outputs.migration-version }}
            com.goodgood.runtime-config.version=${{ steps.release.outputs.runtime-config-version }}

      - name: Record immutable release identity
        shell: bash
        run: |
          {
            echo "### GoodGood container release"
            echo "- Image: \`${{ steps.release.outputs.image-name }}@${{ steps.image.outputs.digest }}\`"
            echo "- Source revision: \`${{ github.sha }}\`"
            echo "- Migration version: \`${{ steps.release.outputs.migration-version }}\`"
            echo "- Runtime configuration contract: \`${{ steps.release.outputs.runtime-config-version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
