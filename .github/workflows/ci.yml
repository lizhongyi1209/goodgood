name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.20.0

jobs:
  verify:
    name: Verify source and image
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run repository quality gate
        run: npm run check:local

      - name: Scan locked production dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: node_modules,.sites-runtime,dist,runtime-bundle
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: library
          severity: CRITICAL,HIGH
          scanners: vuln
          timeout: 10m
          hide-progress: true
          version: v0.70.0

      - name: Build verification image
        run: >-
          docker build
          --build-arg GOODGOOD_REVISION=${{ github.sha }}
          --tag goodgood:ci-${{ github.sha }}
          .

      - name: Smoke verification image runtime imports
        run: >-
          docker run --rm
          --entrypoint node
          goodgood:ci-${{ github.sha }}
          --input-type=module
          --eval
          "await import('react'); await import('react-dom/server'); await import('react-server-dom-webpack/client.node'); await import('vinext/server/prod-server');"

      - name: Scan verification image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: goodgood:ci-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln
          timeout: 10m
          hide-progress: true
          skip-setup-trivy: true
          cache: false

  publish-image:
    name: Publish immutable image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Derive release metadata
        id: release
        env:
          GOODGOOD_RELEASE_REPOSITORY: ${{ github.repository }}
        run: node scripts/release-metadata.mjs --github-output

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.release.outputs.image-name }}:${{ github.sha }}
          build-args: |
            GOODGOOD_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.goodgood.migration.version=${{ steps.release.outputs.migration-version }}
            com.goodgood.runtime-config.version=${{ steps.release.outputs.runtime-config-version }}

      - name: Smoke published image runtime imports
        run: >-
          docker run --rm
          --entrypoint node
          ${{ steps.release.outputs.image-name }}@${{ steps.image.outputs.digest }}
          --input-type=module
          --eval
          "await import('react'); await import('react-dom/server'); await import('react-server-dom-webpack/client.node'); await import('vinext/server/prod-server');"

      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.release.outputs.image-name }}@${{ steps.image.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln
          timeout: 10m
          hide-progress: true
          cache: false

      - name: Create artifact-security evidence
        env:
          GOODGOOD_RELEASE_IMAGE: ${{ steps.release.outputs.image-name }}@${{ steps.image.outputs.digest }}
          GOODGOOD_RELEASE_MIGRATION: ${{ steps.release.outputs.migration-version }}
          GOODGOOD_RUNTIME_CONFIG_VERSION: ${{ steps.release.outputs.runtime-config-version }}
        run: node scripts/artifact-security-evidence.mjs

      - name: Upload artifact-security evidence
        id: artifact-security
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: work/artifact-security-evidence.json
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Record immutable release identity
        shell: bash
        run: |
          {
            echo "### GoodGood container release"
            echo "- Image: \`${{ steps.release.outputs.image-name }}@${{ steps.image.outputs.digest }}\`"
            echo "- Source revision: \`${{ github.sha }}\`"
            echo "- Migration version: \`${{ steps.release.outputs.migration-version }}\`"
            echo "- Runtime configuration contract: \`${{ steps.release.outputs.runtime-config-version }}\`"
            echo "- Artifact-security evidence ID: \`${{ steps.artifact-security.outputs.artifact-id }}\`"
            echo "- Artifact-security evidence digest: \`${{ steps.artifact-security.outputs.artifact-digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
